<!DOCTYPE html>
<html>
<head>
  <title>Vault</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  Private Vault
</div>

<br>

<div style="padding:10px;">

  <input type="password"
         id="vaultPassword"
         placeholder="Enter Vault Password">

  <button onclick="unlockVault()">
    Unlock Vault
  </button>

</div>

<div id="vaultSection" style="display:none;">

  <div style="padding:10px;">

    <input type="file" id="vaultFile">

    <button onclick="uploadVaultMedia()">
      Upload
    </button>

  </div>

  <div class="gallery" id="vaultGallery"></div>

</div>

<script type="module" src="vault.js"></script>
<script type="module" src="app.js"></script>
  <div class="bottomNav">

  <div class="navItem"
       onclick="location.href='gallery.html'">

    <div class="navIcon">🏠</div>
    Home

  </div>

  <div class="navItem"
       onclick="location.href='vault.html'">

    <div class="navIcon">🔒</div>
    Vault

  </div>

  <div class="navItem"
       onclick="location.href='account.html'">

    <div class="navIcon">👤</div>
    Account

  </div>

</div>

</body>
</html>
