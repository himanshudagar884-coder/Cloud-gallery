<!DOCTYPE html>
<html>
<head>

  <title>Vault</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
        href="style.css">

</head>
<body>

<!-- TOP BAR -->

<div class="topbar">

  <span class="chatTitle">
    🔒 Private Vault
  </span>

</div>

<!-- VAULT PASSWORD AREA -->

<div class="vaultLockContainer">

  <input type="password"
         id="vaultPassword"
         placeholder="Enter Vault Password">

  <button onclick="unlockVault()">
    Unlock
  </button>

</div>

<!-- VAULT GALLERY -->

<div id="vaultGallery"
     class="gallery">
</div>

<!-- BOTTOM NAV -->

<div class="bottomNav">

  <div class="navItem"
       onclick="
       location.href='gallery.html'
       ">

    <div class="navIcon">
      🏠
    </div>

    Home

  </div>

  <div class="navItem"
       onclick="
       location.href='vault.html'
       ">

    <div class="navIcon">
      🔒
    </div>

    Vault

  </div>

  <div class="navItem"
       onclick="
       location.href='account.html'
       ">

    <div class="navIcon">
      👤
    </div>

    Account

  </div>

</div>

<script type="module"
        src="vault.js">
</script>

</body>
</html>
