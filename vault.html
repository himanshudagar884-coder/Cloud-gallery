<!DOCTYPE html>
<html>
<head>
  <title>Vault</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">

  <span>
    Private Vault
  </span>


<div class="vaultLock">

  <input type="password"
         id="vaultPassword"
         placeholder="Enter Vault Password">

  <button onclick="unlockVault()">
    Unlock
  </button>

</div>

<div id="vaultSection"
     style="display:none;">

  <div class="uploadSection">

    <input type="file"
           id="vaultFile">

    <button onclick="uploadVaultMedia()">
      Upload
    </button>

  </div>

  <div class="gallery"
       id="vaultGallery">
  </div>

</div>

<div class="bottomNav">

  <div class="navItem"
       onclick="location.href='gallery.html'">

    <div class="navIcon">🏠</div>
    Home

  </div>

  <div class="navItem"
       onclick="location.href='vault.html'">

    <div class="navIcon">🔒</div>
    Vault

  </div>

  <div class="navItem"
       onclick="location.href='account.html'">

    <div class="navIcon">👤</div>
    Account

  </div>

</div>

<script>

function toggleMenu(){

  const menu =
    document.getElementById("menu");

  if(menu.style.display === "block"){
    menu.style.display = "none";
  }else{
    menu.style.display = "block";
  }

}

</script>

<script type="module" src="vault.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
