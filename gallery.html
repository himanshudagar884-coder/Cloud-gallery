<!DOCTYPE html>
<html>
<head>
  <title>Cloud Gallery</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">

  <span>
    Cloud Gallery
  </span>

 
<div class="uploadSection">

  <input type="file"
         id="fileInput">

  <button onclick="uploadMedia()">
    Upload
  </button>

</div>

<div class="gallery"
     id="gallery">
</div>

<div class="bottomNav">

  <div class="navItem"
       onclick="location.href='gallery.html'">

    <div class="navIcon">🏠</div>
    Home

  </div>

  <div class="navItem"
       onclick="location.href='vault.html'">

    <div class="navIcon">🔒</div>
    Vault

  </div>

  <div class="navItem"
       onclick="location.href='account.html'">

    <div class="navIcon">👤</div>
    Account

  </div>

</div>

<script>

function toggleMenu(){

  const menu =
    document.getElementById("menu");

  if(menu.style.display === "block"){
    menu.style.display = "none";
  }else{
    menu.style.display = "block";
  }

}

</script>

<script type="module" src="gallery.js"></script>
<script type="module" src="app.js"></script>

</body>
</html>
