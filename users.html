<!DOCTYPE html>
<html>
<head>
  <title>Chats</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">

  <style>

    body{
      margin:0;
      padding:0;
      font-family:Arial;
      background:#ECE5DD;
      padding-bottom:80px;
    }

    .topbar{
      background:#075E54;
      color:white;
      padding:16px;
      font-size:22px;
      font-weight:bold;
      display:flex;
      align-items:center;
      gap:18px;
    }

    .backBtn{
      cursor:pointer;
      font-size:28px;
    }

    .searchBox{
      padding:10px;
      background:white;
    }

    .searchBox input{
      width:100%;
      padding:12px;
      border:none;
      border-radius:25px;
      background:#f2f2f2;
      box-sizing:border-box;
      font-size:15px;
    }

    .user{
      display:flex;
      align-items:center;
      background:white;
      padding:12px;
      border-bottom:1px solid #eee;
      cursor:pointer;
    }

    .avatar{
      width:55px;
      height:55px;
      border-radius:50%;
      background:#2196F3;
      color:white;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:22px;
      font-weight:bold;
      margin-right:12px;
    }

    .userInfo{
      flex:1;
    }

    .username{
      font-size:17px;
      font-weight:bold;
      color:#111;
    }

    .status{
      font-size:13px;
      color:gray;
      margin-top:4px;
    }

    .online{
      color:green;
      font-weight:bold;
    }

  </style>

</head>
<body>

<div class="topbar">

  <span class="backBtn"
        onclick="history.back()">
    ←
  </span>

  <span>
    Chats
  </span>

</div>

<div class="searchBox">

  <input
    type="text"
    placeholder="Search users...">

</div>

<div id="usersList"></div>

<script type="module" src="users.js"></script>

</body>
</html>
