<!DOCTYPE html>
<html>
<head>

  <title>Account</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
        href="style.css">

</head>
<body>

<div class="topbar">

  <span>
    Account
  </span>

  <span class="menuBtn"
        onclick="toggleMenu(event)">
    ⋮
  </span>

</div>

<!-- DROPDOWN -->

<div class="accountMenu"
     id="accountMenu">

  <div onclick="
  location.href='users.html'
  ">

    Chats

  </div>

</div>

<div class="container">

  <div class="profileBox">

    <div class="circle">
      👤
    </div>

    <h2 id="username">
      User
    </h2>

    <p id="email">
      Email
    </p>

    <button class="btn logoutBtn"
            onclick="logout()">

      Logout

    </button>

  </div>

  <!-- STORAGE -->

  <div class="section">

    <div class="sectionTitle">
      Storage
    </div>

    <div class="scrollRow">

      <div class="scrollItem"
           onclick="
           location.href='bin.html'
           ">

        <div class="scrollIcon">
          🗑
        </div>

        <div class="scrollText">
          Bin
        </div>

      </div>

      <div class="scrollItem"
           onclick="
           location.href='vault.html'
           ">

        <div class="scrollIcon">
          🔒
        </div>

        <div class="scrollText">
          Vault
        </div>

      </div>

      <div class="scrollItem"
           onclick="
           location.href='gallery.html'
           ">

        <div class="scrollIcon">
          🖼
        </div>

        <div class="scrollText">
          Gallery
        </div>

      </div>

    </div>

  </div>

</div>

<!-- BOTTOM NAV -->

<div class="bottomNav">

  <div class="navItem"
       onclick="
       location.href='gallery.html'
       ">

    <div class="navIcon">
      🏠
    </div>

    Home

  </div>

  <div class="navItem"
       onclick="
       location.href='vault.html'
       ">

    <div class="navIcon">
      🔒
    </div>

    Vault

  </div>

  <div class="navItem"
       onclick="
       location.href='account.html'
       ">

    <div class="navIcon">
      👤
    </div>

    Account

  </div>

</div>

<script>

function toggleMenu(e){

  e.stopPropagation();

  const menu =
  document.getElementById(
    "accountMenu"
  );

  if(
    menu.style.display ===
    "block"
  ){

    menu.style.display =
    "none";

  }else{

    menu.style.display =
    "block";

  }

}

document.addEventListener(
"click",

function(){

  document
  .getElementById(
    "accountMenu"
  )
  .style.display =
  "none";

}

);

</script>

<script type="module"
        src="account.js">
</script>

</body>
</html>
