<!DOCTYPE html>
<html>
<head>

  <title>Chat</title>

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet"
        href="style.css">

</head>
<body>

<!-- TOP BAR -->

<div class="topbar">

  <span class="backBtn"
        onclick="history.back()">
    ←
  </span>

  <span>
    Chat
  </span>

</div>

<!-- CALL BUTTONS TOP -->

<div class="callButtonsTop">

  <button onclick="startVoiceCall()">
    📞 Voice
  </button>

  <button onclick="startVideoCall()">
    📹 Video
  </button>

</div>

<!-- CHAT AREA -->

<div id="chatContainer"
     class="chatContainer">
</div>

<!-- CALL SCREEN -->

<div id="callScreen"
     class="callScreen"
     style="display:none;">

  <div class="callTopBar">

    <button onclick="endCall()">
      ❌
    </button>

    <div>
      Connected
    </div>

  </div>

  <div class="videoContainer">

    <div id="remote-player"
         class="remoteVideo">
    </div>

    <div id="local-player"
         class="localVideo">
    </div>

  </div>

  <div class="callControls">

    <button onclick="toggleMute()">
      🎤
    </button>

    <button onclick="toggleSpeaker()">
      🔊
    </button>

    <button onclick="switchCamera()">
      🔄
    </button>

    <button onclick="endCall()">
      📞
    </button>

  </div>

</div>

<!-- MESSAGE BAR -->

<div class="bottomBar">

  <button onclick="
  document
  .getElementById('chatImage')
  .click()
  ">
    📷
  </button>

  <input type="file"
         id="chatImage"
         hidden>

  <button onclick="startRecording()">
    🎤
  </button>

  <input type="text"
         id="messageInput"
         placeholder="Type message">

  <button onclick="sendMessage()">
    ➤
  </button>

</div>

<audio id="ringtone"
       loop>

  <source
    src="https://actions.google.com/sounds/v1/alarms/phone_alerts_and_rings.ogg">

</audio>

<script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>

<script type="module"
        src="chat.js">
</script>

</body>
</html>
